<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14313a">
<title>Τρίτη Ματιά</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  /* Layout idea: one narrow column for the phone — photo with numbered points on top, the reading below in four short parts. */
  :root {
    --ink: #17252b;
    --muted: #5b6b70;
    --paper: #f2f4f3;
    --card: #ffffff;
    --line: #d6dddb;
    --accent: #14313a;
    --signal: #d9572b;
    --a: #1f7a74; --b: #b07a12; --c: #6a4fa3; --d: #3b6fb0;
    --display: "Source Serif 4", Georgia, "Times New Roman", serif;
    --body: "Manrope", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e6ecea; --muted: #9fb0b3; --paper: #0f1a1e; --card: #16252b; --line: #2a3d44;
      --accent: #8cc7c1; --signal: #f0875f; --a: #4fb8b0; --b: #e0b04a; --c: #a68be0; --d: #7aa9e6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e6ecea; --muted: #9fb0b3; --paper: #0f1a1e; --card: #16252b; --line: #2a3d44;
    --accent: #8cc7c1; --signal: #f0875f; --a: #4fb8b0; --b: #e0b04a; --c: #a68be0; --d: #7aa9e6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 18px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font: 700 26px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
  h1 small { display: block; font: 500 13px/1.3 var(--body); color: var(--muted); letter-spacing: 0; margin-top: 4px; }
  h2 { font: 700 19px/1.25 var(--display); margin: 0; text-wrap: balance; }
  h3 { font: 600 15px/1.3 var(--body); margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: transparent; color: var(--muted); font: 600 13px var(--body); padding: 6px 11px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--paper); font: 600 15px var(--body); padding: 11px 16px; border-radius: 10px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, .seg button:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  label.field { display: grid; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
  textarea, select { font: 15px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
  textarea { min-height: 64px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 600 13px var(--body); cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--paper); }
  .photo { position: relative; border-radius: 12px; overflow: hidden; background: var(--line); }
  .photo img, .photo svg.sketch { display: block; width: 100%; height: auto; }
  .pin { position: absolute; transform: translate(-50%, -50%); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
         background: var(--signal); color: #fff; font: 700 14px var(--body); border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .tag { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--body); padding: 2px 9px; border-radius: 999px; color: #fff; }
  .code { font: 600 11px var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
  .logic { border-left: 4px solid var(--c0); padding: 2px 0 2px 12px; display: grid; gap: 4px; }
  .item { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
  .num { width: 28px; height: 28px; border-radius: 50%; background: var(--signal); color: #fff; display: grid; place-items: center; font: 700 13px var(--body); }
  .num.move { background: var(--accent); color: var(--paper); border-radius: 8px; }
  .warn { border: 1px dashed var(--signal); border-radius: 12px; padding: 12px; display: grid; gap: 4px; }
  ul.qs { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .status { font-size: 14px; color: var(--muted); }
  .error { color: var(--signal); font-weight: 600; font-size: 14px; }
  .example { font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--signal); }
  .history { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .history button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 4px; cursor: pointer; width: 92px; color: var(--ink); }
  .history img { width: 82px; height: 62px; object-fit: cover; border-radius: 6px; display: block; }
  .history span { display: block; font-size: 11px; line-height: 1.25; margin-top: 4px; text-align: left; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .hidden { display: none !important; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--signal); animation: spin 1s linear infinite; display: inline-block; vertical-align: -4px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  footer { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="appName">Τρίτη Ματιά<small id="tagline">Δείτε τι συναντιέται σε μια φωτογραφία, και τι θα το έφερνε σε επαφή.</small></h1>
    <div class="row">
      <div class="seg" role="group" aria-label="Γλώσσα">
        <button id="langEl" aria-pressed="true">ΕΛ</button><button id="langEn" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <section class="card" id="inputCard">
    <h2 id="tStep1">1. Φωτογραφία</h2>
    <div class="row">
      <label class="btn" for="photoInput" id="tTake" tabindex="0">Τραβήξτε ή επιλέξτε φωτογραφία</label>
      <input id="photoInput" type="file" accept="image/*" class="hidden">
    </div>
    <div class="chips" role="group" aria-label="Είδος" id="kinds"></div>
    <label class="field" for="context"><span id="tContext">Τι είναι και τι σας απασχολεί; (προαιρετικά)</span>
      <textarea id="context" placeholder="π.χ. Η είσοδος του σχολείου μας το πρωί· οι γονείς σταθμεύουν και τα παιδιά περνούν ανάμεσα."></textarea>
    </label>
    <div class="row">
      <button class="btn" id="analyse" disabled>Ανάλυση</button>
      <span class="status" id="status"></span>
    </div>
    <p class="error hidden" id="error"></p>
  </section>

  <section class="history hidden" id="history" aria-label="Προηγούμενες αναλύσεις"></section>

  <section id="result" class="card" aria-live="polite"></section>

  <section class="row" id="resultActions">
    <button class="btn ghost" id="copy">Αντιγραφή κειμένου</button>
    <div class="seg" role="group" aria-label="Όροι">
      <button id="plain" aria-pressed="true">Απλά λόγια</button><button id="expert" aria-pressed="false">Όροι P·L·T</button>
    </div>
  </section>

  <footer id="tFooter">Η ανάλυση βασίζεται στη μέθοδο P·L·T του Αλέξανδρου Τσίγκα (Triact). Μια φωτογραφία δείχνει μια στιγμή· οι προτάσεις είναι αφετηρία για συζήτηση, όχι απόφαση.</footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['var(--a)', 'var(--b)', 'var(--c)', 'var(--d)'];
const STORE = 'triti-matia-history-v1';

const T = {
  el: {
    tagline: 'Δείτε τι συναντιέται σε μια φωτογραφία, και τι θα το έφερνε σε επαφή.',
    step1: '1. Φωτογραφία', take: 'Τραβήξτε ή επιλέξτε φωτογραφία', retake: 'Άλλη φωτογραφία',
    context: 'Τι είναι και τι σας απασχολεί; (προαιρετικά)',
    placeholder: 'π.χ. Η είσοδος του σχολείου μας το πρωί· οι γονείς σταθμεύουν και τα παιδιά περνούν ανάμεσα.',
    analyse: 'Ανάλυση', working: 'Η φωτογραφία διαβάζεται… (περίπου 20–40 δευτερόλεπτα)', copy: 'Αντιγραφή κειμένου', copied: 'Αντιγράφηκε.',
    plain: 'Απλά λόγια', expert: 'Όροι P·L·T',
    kinds: { auto: 'Αυτόματα', space: 'Κτίριο ή χώρος', work: 'Εργασία ή διαδικασία', art: 'Έργο τέχνης' },
    hLogics: 'Ποιες λογικές συναντιούνται', hThresholds: 'Πού συναντιούνται', hMoves: 'Τι θα τις έφερνε σε επαφή',
    hFalse: 'Η εύκολη λύση που κρύβει το πρόβλημα', hOpen: 'Τι μένει ανοιχτό', hLimits: 'Τι δεν φαίνεται από μία φωτογραφία',
    wants: 'Θέλει', seen: 'Φαίνεται από', between: 'ανάμεσα σε', test: 'Πώς θα φανεί ότι δουλεύει',
    example: 'Παράδειγμα', exampleNote: 'Έτσι μοιάζει μια ανάλυση. Τραβήξτε τη δική σας φωτογραφία για να ξεκινήσετε.',
    noClaude: 'Η ανάλυση χρειάζεται σύνδεση στο Claude. Ανοίξτε τη σελίδα στο claude.ai, συνδεδεμένοι, για να αναλύσετε δικές σας φωτογραφίες.',
    noImages: 'Σε αυτή την προβολή δεν επιτρέπεται η αποστολή εικόνων στο Claude.',
    failed: 'Η ανάλυση δεν ολοκληρώθηκε. Δοκιμάστε ξανά σε λίγο.', busy: 'Πολλές αναλύσεις μαζί. Περιμένετε ένα λεπτό και δοκιμάστε ξανά.',
    denied: 'Δεν δόθηκε άδεια για χρήση του Claude. Πατήστε ξανά «Ανάλυση» και επιτρέψτε τη.',
    badPhoto: 'Η φωτογραφία δεν διαβάστηκε. Δοκιμάστε JPEG ή PNG.',
    footer: 'Η ανάλυση βασίζεται στη μέθοδο P·L·T του Αλέξανδρου Τσίγκα (Triact). Μια φωτογραφία δείχνει μια στιγμή· οι προτάσεις είναι αφετηρία για συζήτηση, όχι απόφαση.',
    codes: { logic: 'K', threshold: 'L', move: 'T', falseFix: 'ψευδο-τρίτο' },
  },
  en: {
    tagline: 'See what meets in a photo, and what would bring it into contact.',
    step1: '1. Photo', take: 'Take or choose a photo', retake: 'Another photo',
    context: 'What is it, and what concerns you? (optional)',
    placeholder: 'e.g. Our school entrance in the morning; parents park and children pass between the cars.',
    analyse: 'Analyse', working: 'Reading the photo… (about 20–40 seconds)', copy: 'Copy text', copied: 'Copied.',
    plain: 'Plain words', expert: 'P·L·T terms',
    kinds: { auto: 'Automatic', space: 'Building or space', work: 'Work or process', art: 'Artwork' },
    hLogics: 'Which logics meet here', hThresholds: 'Where they meet', hMoves: 'What would bring them into contact',
    hFalse: 'The easy fix that hides the problem', hOpen: 'What stays open', hLimits: 'What one photo cannot show',
    wants: 'Wants', seen: 'Seen in', between: 'between', test: 'How you would know it works',
    example: 'Example', exampleNote: 'This is what an analysis looks like. Take your own photo to begin.',
    noClaude: 'Analysis needs a Claude sign-in. Open this page on claude.ai while signed in to analyse your own photos.',
    noImages: 'This view does not allow sending images to Claude.',
    failed: 'The analysis did not finish. Please try again shortly.', busy: 'Too many analyses at once. Wait a minute and try again.',
    denied: 'Permission to use Claude was not given. Press “Analyse” again and allow it.',
    badPhoto: 'The photo could not be read. Try a JPEG or PNG.',
    footer: 'The analysis follows the P·L·T method by Alexander Tsigkas (Triact). A photo shows one moment; the suggestions are a starting point for discussion, not a decision.',
    codes: { logic: 'K', threshold: 'L', move: 'T', falseFix: 'false third' },
  },
};

const EXAMPLE = {
  el: {
    subject: 'Είσοδος σχολείου στις 8 το πρωί',
    summary: 'Στο ίδιο πεζοδρόμιο συναντιούνται τα αυτοκίνητα των γονιών, τα παιδιά που μπαίνουν στο σχολείο και οι περίοικοι που περνούν. Κάθε ομάδα ακολουθεί τη δική της λογική και κανείς δεν «κατέχει» το σημείο όπου διασταυρώνονται.',
    logics: [
      { name: 'Η λογική του γονιού με το αυτοκίνητο', wants: 'Να αφήσει το παιδί όσο πιο κοντά γίνεται, σε λίγα δευτερόλεπτα.', evidence: 'Τα αυτοκίνητα σε διπλή στάθμευση μπροστά στην πόρτα.' },
      { name: 'Η λογική του παιδιού', wants: 'Να φτάσει στην αυλή μαζί με τους φίλους του, χωρίς να περιμένει.', evidence: 'Τα παιδιά που περνούν ανάμεσα στα αυτοκίνητα.' },
      { name: 'Η λογική της γειτονιάς', wants: 'Να περάσει, να βγάλει το αυτοκίνητό της, να ανοίξει το μαγαζί.', evidence: 'Ο πεζός με το καρότσι που κατεβαίνει στον δρόμο.' },
    ],
    thresholds: [
      { title: 'Η πόρτα του αυτοκινήτου στη μέση του δρόμου', between: [0, 1], happens: 'Το παιδί βγαίνει από την πλευρά της κυκλοφορίας· εδώ η βιασύνη του γονιού γίνεται κίνδυνος για το παιδί.', x: 34, y: 62 },
      { title: 'Το στενό πεζοδρόμιο μπροστά στην πόρτα', between: [1, 2], happens: 'Παιδιά που περιμένουν και περαστικοί πιέζονται στο ίδιο ένα μέτρο.', x: 70, y: 70 },
    ],
    moves: [
      { title: 'Σημείο αποβίβασης 50 μέτρα πιο πέρα', how: 'Ορισμένη ζώνη στάσης 7:45–8:15 στη γωνία, με εθελοντή γονέα που συνοδεύει τα παιδιά ως την πόρτα.', connects: [0, 1], threshold: 1, test: 'Κανένα αυτοκίνητο σε διπλή στάθμευση μπροστά στην πόρτα για δύο εβδομάδες.' },
      { title: 'Η πόρτα ανοίγει νωρίτερα', how: 'Η αυλή ανοίγει στις 7:40, ώστε τα παιδιά να μη στοιβάζονται στο πεζοδρόμιο.', connects: [1, 2], threshold: 2, test: 'Ελεύθερο πέρασμα για καρότσι στις 8:00.' },
    ],
    falseFix: 'Ένα κάγκελο κατά μήκος του πεζοδρομίου. Χωρίζει τα παιδιά από τον δρόμο, αλλά μεταφέρει την ίδια σύγκρουση στην πρώτη διάβαση.',
    open: ['Ποιος αναλαμβάνει τη συνοδεία από τη ζώνη στάσης;', 'Δέχονται οι καταστηματάρχες της γωνίας τη ζώνη για μισή ώρα;'],
    limits: 'Η εικόνα δεν δείχνει τον όγκο της κυκλοφορίας άλλες ώρες ούτε τις απόψεις των γονιών.',
  },
  en: {
    subject: 'A school entrance at 8 in the morning',
    summary: 'Parents’ cars, children entering the school and neighbours passing by meet on the same pavement. Each group follows its own logic, and nobody “owns” the spot where they cross.',
    logics: [
      { name: 'The driving parent’s logic', wants: 'To drop the child as close as possible, in a few seconds.', evidence: 'Cars double-parked in front of the gate.' },
      { name: 'The child’s logic', wants: 'To reach the yard with friends, without waiting.', evidence: 'Children walking between the cars.' },
      { name: 'The neighbourhood’s logic', wants: 'To get past, drive out, open the shop.', evidence: 'The pedestrian with a pram stepping into the road.' },
    ],
    thresholds: [
      { title: 'The car door in the middle of the road', between: [0, 1], happens: 'The child gets out on the traffic side; here the parent’s hurry becomes the child’s risk.', x: 34, y: 62 },
      { title: 'The narrow pavement at the gate', between: [1, 2], happens: 'Waiting children and passers-by are squeezed into the same metre.', x: 70, y: 70 },
    ],
    moves: [
      { title: 'A drop-off point 50 metres away', how: 'A marked stopping zone at the corner from 7:45 to 8:15, with a volunteer parent walking children to the gate.', connects: [0, 1], threshold: 1, test: 'No double-parked car at the gate for two weeks.' },
      { title: 'The gate opens earlier', how: 'The yard opens at 7:40 so children do not crowd the pavement.', connects: [1, 2], threshold: 2, test: 'Room for a pram to pass at 8:00.' },
    ],
    falseFix: 'A railing along the pavement. It separates children from the road but moves the same conflict to the first crossing.',
    open: ['Who walks the children from the drop-off point?', 'Will the corner shopkeepers accept the zone for half an hour?'],
    limits: 'The picture does not show traffic at other hours or what parents think.',
  },
};

const SKETCH = `<svg class="sketch" viewBox="0 0 400 260" role="img" aria-label="Σκίτσο εισόδου σχολείου">
  <rect width="400" height="260" fill="#cfd8d6"/><rect y="150" width="400" height="110" fill="#8e9a99"/>
  <rect y="150" width="400" height="30" fill="#b9c3c1"/><rect x="220" y="40" width="170" height="110" fill="#e7d9bf"/>
  <rect x="270" y="95" width="50" height="55" fill="#5b4a3a"/><rect x="40" y="185" width="110" height="45" rx="10" fill="#3b6fb0"/>
  <rect x="170" y="190" width="100" height="42" rx="10" fill="#c24a3a"/><circle cx="140" cy="168" r="7" fill="#17252b"/>
  <rect x="136" y="175" width="8" height="18" fill="#17252b"/><circle cx="290" cy="168" r="7" fill="#17252b"/>
  <rect x="286" y="175" width="8" height="18" fill="#17252b"/><circle cx="310" cy="170" r="6" fill="#17252b"/>
</svg>`;

let lang = 'el', expert = false, kind = 'auto', photoBlob = null, photoUrl = null;
let current = { data: null, image: null, example: true };
let samplePromise = null;

function t(k) { return T[lang][k]; }
function sampleCap() { if (!samplePromise) samplePromise = (window.claude && claude.use) ? claude.use('sample') : Promise.resolve(null); return samplePromise; }

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  $('#langEl').setAttribute('aria-pressed', String(l === 'el'));
  $('#langEn').setAttribute('aria-pressed', String(l === 'en'));
  $('#appName').firstChild.textContent = l === 'el' ? 'Τρίτη Ματιά' : 'Third Look';
  $('#tagline').textContent = t('tagline');
  $('#tStep1').textContent = t('step1');
  $('#tTake').textContent = photoBlob ? t('retake') : t('take');
  $('#tContext').textContent = t('context');
  $('#context').placeholder = t('placeholder');
  $('#analyse').textContent = t('analyse');
  $('#copy').textContent = t('copy');
  $('#plain').textContent = t('plain');
  $('#expert').textContent = t('expert');
  $('#tFooter').textContent = t('footer');
  renderKinds();
  if (current.example) current.data = EXAMPLE[lang];
  render();
}

function renderKinds() {
  $('#kinds').innerHTML = Object.entries(t('kinds')).map(([k, label]) =>
    `<button class="chip" data-kind="${k}" aria-pressed="${k === kind}">${esc(label)}</button>`).join('');
}

function code(prefix, i) { return expert ? `<span class="code">${prefix}${i + 1}</span>` : ''; }

function render() {
  const d = current.data;
  if (!d) { $('#result').innerHTML = current.image ? `<div class="photo"><img src="${current.image}" alt=""></div>` : ''; return; }
  const img = current.example ? SKETCH : `<img src="${current.image}" alt="${esc(d.subject)}">`;
  const pins = (d.thresholds || []).map((th, i) =>
    `<div class="pin" style="left:${Math.min(96, Math.max(4, +th.x || 50))}%;top:${Math.min(96, Math.max(4, +th.y || 50))}%" aria-hidden="true">${i + 1}</div>`).join('');
  const logicTag = (i) => `<span class="tag" style="background:${COLORS[i % 4]}">${esc(shortName(d.logics[i]?.name, i))}</span>`;
  $('#result').innerHTML = `
    ${current.example ? `<p class="example">${t('example')}</p><p class="muted">${t('exampleNote')}</p>` : ''}
    <h2>${esc(d.subject)}</h2>
    <div class="photo">${img}${pins}</div>
    <p>${esc(d.summary)}</p>
    <h3>${t('hLogics')}</h3>
    ${(d.logics || []).map((l, i) => `<div class="logic" style="--c0:${COLORS[i % 4]}">
        <div class="row"><strong>${esc(l.name)}</strong>${code(t('codes').logic, i)}</div>
        <p><span class="muted">${t('wants')}:</span> ${esc(l.wants)}</p>
        <p class="muted">${t('seen')}: ${esc(l.evidence)}</p></div>`).join('')}
    <h3>${t('hThresholds')}</h3>
    ${(d.thresholds || []).map((th, i) => `<div class="item"><span class="num">${i + 1}</span><div style="display:grid;gap:4px">
        <div class="row"><strong>${esc(th.title)}</strong>${code(t('codes').threshold, i)}</div>
        <div class="row muted">${t('between')} ${(th.between || []).filter((j) => d.logics[j]).map(logicTag).join(' ')}</div>
        <p>${esc(th.happens)}</p></div></div>`).join('')}
    <h3>${t('hMoves')}</h3>
    ${(d.moves || []).map((m, i) => `<div class="item"><span class="num move">${String.fromCharCode(65 + i)}</span><div style="display:grid;gap:4px">
        <div class="row"><strong>${esc(m.title)}</strong>${code(t('codes').move, i)}${m.threshold ? `<span class="muted">→ ${m.threshold}</span>` : ''}</div>
        <p>${esc(m.how)}</p>
        <div class="row">${(m.connects || []).filter((j) => d.logics[j]).map(logicTag).join(' ')}</div>
        <p class="muted">${t('test')}: ${esc(m.test)}</p></div></div>`).join('')}
    ${d.falseFix ? `<div class="warn"><div class="row"><strong>${t('hFalse')}</strong>${expert ? `<span class="code">${t('codes').falseFix}</span>` : ''}</div><p>${esc(d.falseFix)}</p></div>` : ''}
    ${(d.open || []).length ? `<h3>${t('hOpen')}</h3><ul class="qs">${d.open.map((q) => `<li>${esc(q)}</li>`).join('')}</ul>` : ''}
    ${d.limits ? `<p class="muted"><strong>${t('hLimits')}:</strong> ${esc(d.limits)}</p>` : ''}`;
}

function shortName(name, i) {
  const s = String(name || '').replace(/^(Η λογική (του|της|των)\s+|The\s+|logic of\s+)/i, '').replace(/[’']s logic$/i, '').replace(/ logic$/i, '');
  return s.length > 28 ? s.slice(0, 26) + '…' : s || String.fromCharCode(65 + i);
}

function asText() {
  const d = current.data; if (!d || !d.logics) return '';
  const L = (i) => d.logics[i]?.name || '';
  return [d.subject, '', d.summary, '', t('hLogics') + ':',
    ...d.logics.map((l, i) => `${expert ? 'K' + (i + 1) + ' ' : '- '}${l.name}: ${l.wants} (${l.evidence})`), '',
    t('hThresholds') + ':', ...d.thresholds.map((th, i) => `${i + 1}. ${th.title} [${th.between.map(L).join(' / ')}]: ${th.happens}`), '',
    t('hMoves') + ':', ...d.moves.map((m, i) => `${String.fromCharCode(65 + i)}. ${m.title}: ${m.how} ${t('test')}: ${m.test}`), '',
    t('hFalse') + ': ' + d.falseFix, '', t('hOpen') + ':', ...d.open.map((q) => '- ' + q), '', t('hLimits') + ': ' + d.limits, '', t('footer')].join('\n');
}

// Downscale the photo before sending: smaller, faster, and strips location data.
async function prepare(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
    const max = 1568, scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
    const tc = document.createElement('canvas'); const ts = 200 / Math.max(c.width, c.height);
    tc.width = Math.round(c.width * ts); tc.height = Math.round(c.height * ts);
    tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
    return { blob, display: c.toDataURL('image/jpeg', 0.8), thumb: tc.toDataURL('image/jpeg', 0.7) };
  } finally { URL.revokeObjectURL(url); }
}

let prepared = null;
$('#photoInput').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  $('#error').classList.add('hidden');
  try {
    prepared = await prepare(f);
    photoBlob = prepared.blob;
    current = { data: null, image: prepared.display, example: false };
    render();
    $('#tTake').textContent = t('retake');
    $('#analyse').disabled = false;
  } catch { showError(t('badPhoto')); }
});
$('#tTake').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#photoInput').click(); } });

function showError(msg) { const el = $('#error'); el.textContent = msg; el.classList.remove('hidden'); }

const KIND_HINT = {
  auto: 'Decide yourself what kind of scene this is.',
  space: 'Read it as a building, street, square or interior: who uses it, what rules and forces shape it.',
  work: 'Read it as a workplace or process: flows of material, people, information, time, safety, quality.',
  art: 'Read it as an artwork or image: the orders, materials, gazes and meanings that meet in it.',
};

function prompt(note) {
  const language = lang === 'el' ? 'Greek (Modern Greek, plain everyday register)' : 'English (plain everyday register)';
  return `You are analysing ONE photo with the P·L·T method (Polycontexturality · Liminality · Transjunction, by Alexander Tsigkas).
Method, in short:
- Polycontexturality: a situation holds several logics (contexts) at once, each valid on its own terms, with its own rules and values. Name 2 to 4 that are really visible or strongly implied in the photo. Do not invent people or facts that cannot be seen.
- Liminality: the thresholds where those logics meet and neither one governs. Locate 2 to 4 such thresholds IN THE PHOTO and give the approximate position of each as x and y percentages of the image width and height (0,0 = top left).
- Transjunction: concrete moves that let two logics act together without one absorbing the other. Give 2 to 4, each tied to a threshold, small and testable, with how one would know it works.
- The false third: one tempting fix that only hides or displaces the tension.
${KIND_HINT[kind]}
${note ? 'The person adds this context: """' + note.slice(0, 600) + '"""' : 'The person gave no extra context.'}
Write every text field in ${language}. Use plain words for a member of the public: no method jargon (do not write "context", "contexture", "liminal", "transjunction", "P·L·T" in the fields). Be specific to what is visible. Short sentences.
Return ONLY JSON with exactly this shape:
{"subject": string (max 8 words), "summary": string (2-3 sentences),
 "logics": [{"name": string (e.g. "The driver's logic"), "wants": string, "evidence": string (what in the photo shows it)}],
 "thresholds": [{"title": string, "between": [logic index, logic index] (0-based), "happens": string, "x": number, "y": number}],
 "moves": [{"title": string, "how": string, "connects": [logic index, logic index], "threshold": number (1-based threshold number), "test": string}],
 "falseFix": string, "open": [string, string], "limits": string (what one photo cannot show)}`;
}

function clean(d) {
  const arr = (v) => Array.isArray(v) ? v : [];
  const n = (v, lo, hi) => { const x = Number(v); return Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : null; };
  const logics = arr(d.logics).slice(0, 4).map((l) => ({ name: String(l.name || ''), wants: String(l.wants || ''), evidence: String(l.evidence || '') }));
  const idx = (v) => arr(v).map(Number).filter((j) => Number.isInteger(j) && j >= 0 && j < logics.length);
  const thresholds = arr(d.thresholds).slice(0, 4).map((th) => ({ title: String(th.title || ''), between: idx(th.between), happens: String(th.happens || ''), x: n(th.x, 0, 100) ?? 50, y: n(th.y, 0, 100) ?? 50 }));
  return {
    subject: String(d.subject || ''), summary: String(d.summary || ''), logics, thresholds,
    moves: arr(d.moves).slice(0, 4).map((m) => ({ title: String(m.title || ''), how: String(m.how || ''), connects: idx(m.connects), threshold: n(m.threshold, 1, thresholds.length), test: String(m.test || '') })),
    falseFix: String(d.falseFix || ''), open: arr(d.open).slice(0, 4).map(String), limits: String(d.limits || ''),
  };
}

let busy = false;
$('#analyse').addEventListener('click', async () => {
  if (busy || !photoBlob) return;
  $('#error').classList.add('hidden');
  const sample = await sampleCap();
  if (!sample) { showError(t('noClaude')); return; }
  try {
    const lim = await sample.limits();
    if (!lim || !lim.images) { showError(t('noImages')); return; }
  } catch { /* limits unavailable: try anyway */ }
  busy = true; $('#analyse').disabled = true;
  $('#status').innerHTML = `<span class="spinner" aria-hidden="true"></span>${t('working')}`;
  try {
    const raw = await sample.json(prompt($('#context').value.trim()), { images: [photoBlob], modelTier: 'complex', cache: false });
    current = { data: clean(raw), image: prepared.display, example: false };
    render();
    saveHistory();
    $('#result').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  } catch (e) {
    const c = e && e.code;
    showError(c === 'rate_limited' ? t('busy') : c === 'not_granted' ? t('denied') : t('failed'));
  } finally {
    busy = false; $('#analyse').disabled = false; $('#status').textContent = '';
  }
});

function loadHistory() { try { return JSON.parse(localStorage.getItem(STORE) || '[]'); } catch { return []; } }
function saveHistory() {
  const list = [{ at: Date.now(), thumb: prepared.thumb, image: prepared.display, data: current.data }, ...loadHistory()].slice(0, 6);
  for (let n = list.length; n > 0; n--) {
    try { localStorage.setItem(STORE, JSON.stringify(list.slice(0, n))); break; } catch { /* storage full: keep fewer */ }
  }
  renderHistory();
}
function renderHistory() {
  const list = loadHistory();
  const box = $('#history');
  box.classList.toggle('hidden', !list.length);
  box.innerHTML = list.map((h, i) => `<button data-h="${i}"><img src="${h.thumb}" alt=""><span>${esc(h.data.subject)}</span></button>`).join('');
}

document.addEventListener('click', async (e) => {
  const k = e.target.closest('[data-kind]');
  if (k) { kind = k.dataset.kind; renderKinds(); return; }
  const h = e.target.closest('[data-h]');
  if (h) { const item = loadHistory()[+h.dataset.h]; if (item) { current = { data: item.data, image: item.image, example: false }; render(); $('#result').scrollIntoView({ block: 'start' }); } return; }
});
$('#langEl').addEventListener('click', () => setLang('el'));
$('#langEn').addEventListener('click', () => setLang('en'));
$('#plain').addEventListener('click', () => { expert = false; $('#plain').setAttribute('aria-pressed', 'true'); $('#expert').setAttribute('aria-pressed', 'false'); render(); });
$('#expert').addEventListener('click', () => { expert = true; $('#plain').setAttribute('aria-pressed', 'false'); $('#expert').setAttribute('aria-pressed', 'true'); render(); });
$('#copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(asText()); $('#status').textContent = t('copied'); setTimeout(() => { if (!busy) $('#status').textContent = ''; }, 2500); }
  catch { showError(lang === 'el' ? 'Η αντιγραφή δεν επιτράπηκε σε αυτή την προβολή.' : 'Copying is not allowed in this view.'); }
});

current = { data: EXAMPLE.el, image: null, example: true };
renderKinds(); render(); renderHistory();
</script>
